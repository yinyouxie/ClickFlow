name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish portable self-contained build
        shell: pwsh
        run: |
          dotnet publish ClickFlow/ClickFlow.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -o publish

          New-Item -ItemType Directory -Force release/ClickFlow | Out-Null
          Copy-Item publish/* release/ClickFlow -Recurse -Force
          Copy-Item README.md release/ClickFlow/README.md -Force
          Copy-Item 快速开始.txt release/ClickFlow/快速开始.txt -Force
          Copy-Item samples release/ClickFlow/samples -Recurse -Force
          Copy-Item screenshots release/ClickFlow/screenshots -Recurse -Force
          Set-Content release/ClickFlow/portable.flag "portable"

          $zip = "release/ClickFlow-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path release/ClickFlow -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)" | Set-Content "$zip.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClickFlow-win-x64
          path: |
            release/*.zip
            release/*.zip.sha256

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.zip.sha256
          generate_release_notes: true
